<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Диагностика связи</title>
<style>
body{margin:0;padding:20px;background:#0b0f0c;color:#e8f5ec;font:16px/1.5 -apple-system,system-ui,sans-serif}
h1{font-size:22px;margin:0 0 6px}p{color:#7f9a89;margin:0 0 14px}
input{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid #2a4a35;background:#111a14;color:#e8f5ec;font-size:16px}
button{margin-top:12px;width:100%;padding:14px;border:0;border-radius:14px;background:#2bff7a;color:#04210f;font-weight:800;font-size:17px}
button.s{background:#1b2a21;color:#e8f5ec;border:1px solid #2a4a35}
.r{margin:10px 0;padding:12px;border-radius:12px;background:#111a14;border:1px solid #2a4a35}
.ok{border-color:#2bff7a}.bad{border-color:#ff4d5e}small{color:#7f9a89}
</style></head><body>
<h1>Диагностика связи</h1>
<p>Вставь адрес шлюза Яндекс Облака (https://….apigw.yandexcloud.net) и нажми «Проверить шлюз». Ожидаемые ответы: HTTP 401, 401 и 400.</p>
<input id="gw" type="url" placeholder="https://….apigw.yandexcloud.net" autocapitalize="off" autocorrect="off">
<button id="go">Проверить шлюз</button>
<button id="gd" class="s">Проверить Supabase напрямую</button>
<div id="out"></div>
<script>
var D="https://khqvcwfcotplgfmefwnd.supabase.co",K="sb_publishable_ckCz0Gj3zGXbWjJK_pLiDg_C9FfFtsr";
function $(i){return document.getElementById(i)}
function add(t,cls,sub){
  var d=document.createElement("div");d.className="r "+(cls||"");
  d.innerHTML="<b></b><br><small></small>";
  d.firstChild.textContent=t;d.lastChild.textContent=sub||"";
  $("out").appendChild(d);return d;
}
function test(name,url,opt){
  var row=add(name+": проверяю…","",""),t0=Date.now(),c=new AbortController(),tm=setTimeout(function(){c.abort()},15000);
  opt.signal=c.signal;
  return fetch(url,opt).then(function(r){
    clearTimeout(tm);var ms=Date.now()-t0;
    row.className="r ok";row.firstChild.textContent=name+": ответ за "+ms+" мс";
    row.lastChild.textContent="HTTP "+r.status;
  }).catch(function(e){
    clearTimeout(tm);var ms=Date.now()-t0;
    row.className="r bad";
    row.firstChild.textContent=name+": НЕ удалось ("+(e&&e.name==="AbortError"?"зависло на 15 с":"ошибка")+")";
    row.lastChild.textContent=ms+" мс · "+(e&&e.message||"")+" (если ошибка сразу, а не по таймауту, возможно, шлюз не отдаёт заголовки CORS)";
  });
}
function suite(base,title){
  $("out").innerHTML="";
  add(title,"",(navigator.onLine?"онлайн":"офлайн")+" · "+new Date().toLocaleString());
  return test("1. Простой запрос",base+"/rest/v1/?apikey="+K,{method:"GET"})
    .then(function(){return test("2. Запрос с заголовком",base+"/rest/v1/",{method:"GET",headers:{apikey:K}})})
    .then(function(){return test("3. Вход (POST)",base+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:K,"Content-Type":"application/json"},body:JSON.stringify({email:"x@example.com",password:"x"})})})
    .then(function(){add("Готово. Сделай скриншот этого экрана.","","")});
}
$("go").onclick=function(){
  var g=$("gw").value.trim().replace(/\/+$/,"");
  try{localStorage.setItem("diag_gw",g)}catch(e){}
  if(!g){$("out").innerHTML="";add("Вставь адрес шлюза","bad","");return}
  suite(g,"Шлюз: "+g);
};
$("gd").onclick=function(){suite(D,"Supabase напрямую")};
try{$("gw").value=localStorage.getItem("diag_gw")||""}catch(e){}
</script></body></html>
